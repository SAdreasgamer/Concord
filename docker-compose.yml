services:
  concord:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./uploads:/app/uploads
      - concord-db:/app/data
    environment:
      - DEFAULT_LLM_MODEL=${DEFAULT_LLM_MODEL:-gemini/gemini-3.6-flash}
      - DB_PATH=/app/data/concord.db
    restart: unless-stopped

volumes:
  concord-db:
